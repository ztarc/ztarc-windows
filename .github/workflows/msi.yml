# Build the ZTARC Windows client and its installer.
#
# The executable cross-compiles on Linux and does so in `make build`; this job
# exists for the MSI, which cannot be built anywhere else. WiX hardcodes `C:\`
# in BundleValidator.GetCanonicalRelativePath and validates it with
# Path.GetFullPath, so on Linux every Directory/@Name is rejected — a minimal
# one-directory .wxs fails exactly as ours does. It prints "The WiX Toolset only
# supports Windows. All behavior after this point is undefined" and means it.
#
# Release tags and opted-in manual builds sign the EXE before packaging, then
# sign the MSI. Verification must succeed before checksums or publication.
#
# Every step calls the same scripts/ that the Makefile calls. Duplicating the
# build here would let CI and a developer's machine produce different binaries
# without either noticing.

name: msi

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign EXE and MSI with the SSL.com production certificate
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Build jobs only read. A separate publish job can write releases on tag pushes.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign)) && 'code-signing' || 'unsigned-ci' }}
    env:
      SIGN_BUILD: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign) }}
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    concurrency:
      group: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign)) && 'sslcom-signing' || format('unsigned-{0}', github.ref) }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash

    steps:
      - name: Record signing mode
        id: mode
        run: echo "signed=$SIGN_BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # upstream/ is the whole source; without it there is nothing to brand.
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod

      # Pinned to 5.0.2 on purpose. v6 introduced the Open Source Maintenance
      # Fee and v7 refuses to run until its EULA is accepted, which for an
      # organisation over $10k/yr means sponsoring the wixtoolset project.
      # Moving off this version is a licensing decision, not a version bump.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      # Not vendored: it is WireGuard LLC's signed binary and it ships inside
      # our installer, so it comes from its own source with its hash checked.
      - name: Fetch wintun.dll
        run: ./scripts/fetch-wintun.sh

      - name: Stage the ZTARC branding
        run: ./scripts/rebrand.sh

      # The gate, not a formality: a substitution that stops matching after an
      # upstream bump leaves a binary that calls itself by the wrong name, and
      # nothing else would notice.
      - name: Brand audit
        run: ./scripts/audit-brand.sh

      # A tag that disagrees with version.go would publish an installer whose
      # filename, properties and release page all say different things. The
      # version lives in one file; this is where the tag is held to it.
      - name: Check the tag matches version.go
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared="$(. ./scripts/version.sh && ztarc_version brand/overrides/version/version.go)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, brand/overrides/version/version.go says $declared." >&2
            echo "Bump Build in version.go, or tag the version that is actually in the tree." >&2
            exit 1
          fi
          echo "tag and version.go agree on $declared"

      - name: Check signing configuration
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SSL_USERNAME: ${{ secrets.SSL_USERNAME }}
          SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}
          SSL_CREDENTIAL_ID: ${{ secrets.SSL_CREDENTIAL_ID }}
          SSL_TOTP_SECRET: ${{ secrets.SSL_TOTP_SECRET }}
          SSL_CERT_SHA1: ${{ vars.SSL_CERT_SHA1 }}
        run: |
          foreach ($name in @('SSL_USERNAME', 'SSL_PASSWORD', 'SSL_CREDENTIAL_ID', 'SSL_TOTP_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing secret: $name"
            }
          }
          $thumbprint = $env:SSL_CERT_SHA1 -replace '[\s:]', ''
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'SSL_CERT_SHA1 must contain the production leaf certificate SHA-1 thumbprint'
          }

      - name: Build ZTARC.exe
        run: ./scripts/build-exe.sh

      - name: Sign ZTARC.exe
        if: env.SIGN_BUILD == 'true'
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747 # SSL.com action, pinned commit
        with:
          command: sign
          username: ${{ secrets.SSL_USERNAME }}
          password: ${{ secrets.SSL_PASSWORD }}
          credential_id: ${{ secrets.SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/build/ZTARC.exe
          override: true
          environment_name: PROD
          signing_method: v2
          clean_logs: false

      - name: Verify ZTARC.exe before packaging
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SSL_CERT_SHA1: ${{ vars.SSL_CERT_SHA1 }}
        run: |
          & ./scripts/verify-authenticode.ps1 -Path './build/ZTARC.exe'

      - name: Build the installer
        run: ./scripts/build-msi.sh

      - name: Locate installer
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath './build' -Filter 'ztarc-amd64-*.msi' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI, found $($installers.Count)"
          }
          "MSI_PATH=$($installers[0].FullName)" >> $env:GITHUB_ENV

      - name: Sign MSI
        if: env.SIGN_BUILD == 'true'
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747 # SSL.com action, pinned commit
        with:
          command: sign
          username: ${{ secrets.SSL_USERNAME }}
          password: ${{ secrets.SSL_PASSWORD }}
          credential_id: ${{ secrets.SSL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_TOTP_SECRET }}
          file_path: ${{ env.MSI_PATH }}
          program_name: ZTARC
          override: true
          environment_name: PROD
          signing_method: v2
          clean_logs: false

      - name: Verify signed deliverables
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SSL_CERT_SHA1: ${{ vars.SSL_CERT_SHA1 }}
        run: |
          $verify = './scripts/verify-authenticode.ps1'
          & $verify -Path './build/ZTARC.exe'
          & $verify -Path $env:MSI_PATH

      - name: Verify the EXE packaged inside the MSI
        if: env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SSL_CERT_SHA1: ${{ vars.SSL_CERT_SHA1 }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'ztarc-msi-extracted'
          $arguments = "/a `"$env:MSI_PATH`" /qn TARGETDIR=`"$destination`""
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "MSI extraction failed: $($process.ExitCode)"
          }
          $files = @(Get-ChildItem -LiteralPath $destination -Filter 'ZTARC.exe' -Recurse -File)
          if ($files.Count -ne 1) {
            throw "Expected one packaged EXE, found $($files.Count)"
          }
          & ./scripts/verify-authenticode.ps1 -Path $files[0].FullName
          $original = (Get-FileHash -LiteralPath './build/ZTARC.exe' -Algorithm SHA256).Hash
          $packaged = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash
          if ($original -ne $packaged) {
            throw 'Packaged EXE differs from the signed build output'
          }

      # Hash final files only, after signing and verification when enabled.
      - name: Checksums
        run: |
          cd build && sha256sum ZTARC.exe *.msi > SHA256SUMS && cat SHA256SUMS

      - name: Report what was built
        run: |
          version="$(. ./scripts/version.sh && ztarc_version brand/overrides/version/version.go)"
          echo "### ZTARC $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticode signing: $SIGN_BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la build/*.exe build/*.msi >> "$GITHUB_STEP_SUMMARY"
          cat build/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ztarc-windows
          # The installer is the deliverable; the bare .exe is here because it
          # is what you copy to a VM to look at a UI change without installing.
          path: |
            build/*.msi
            build/ZTARC.exe
            build/SHA256SUMS
          if-no-files-found: error

      - name: Remove signing logs
        if: always() && env.SIGN_BUILD == 'true'
        shell: pwsh
        run: |
          $logs = Join-Path $env:GITHUB_WORKSPACE 'codesign/CodeSignTool-v1.3.0/logs'
          if (Test-Path -LiteralPath $logs) {
            Remove-Item -LiteralPath $logs -Recurse -Force
          }

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: ztarc-windows
          path: build

      # Testers should not need a GitHub account, and Actions artifacts require
      # one and expire after 90 days. A release asset is a permanent public URL
      # on a public repository, which is what "send the testers a link" needs.
      #
      # Published with the `gh` CLI that ships on the runner rather than a
      # third-party action: this is the step that hands a binary to other people,
      # and it is not the place to add a supply-chain dependency for convenience.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(. ./scripts/version.sh && ztarc_version brand/overrides/version/version.go)"
          upstream="$(git -C upstream describe --tags --always)"

          cat > notes.md <<NOTES
          ZTARC Windows client **$version**, built from upstream \`fosrl/windows\` $upstream.

          ## Install

          Download \`ztarc-amd64-$version.msi\` and run it.

          The installer and ZTARC.exe are Authenticode signed and timestamped.
          Check Digital Signatures in the file properties to confirm the publisher.
          Windows SmartScreen may still warn while reputation is developing.
          Verify what you downloaded against SHA256SUMS:

          \`\`\`powershell
          Get-FileHash .\\ztarc-amd64-$version.msi -Algorithm SHA256
          \`\`\`

          and compare it against \`SHA256SUMS\` below.

          The installer registers the \`ZTARCManager\` service, which is what lets
          the tunnel create its network adapter. Running \`ZTARC.exe\` on its own
          is not a supported install — it is here only for looking at a UI change
          without installing.

          ## Source

          This is a modified build of AGPL-3 software. The corresponding source is
          this repository at \`${GITHUB_SHA}\`, together with the \`upstream/\`
          submodule at its recorded commit. The client links to it from the tray
          menu and from Preferences → About.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ZTARC $version" \
            --notes-file notes.md \
            "build/ztarc-amd64-$version.msi" \
            "build/ZTARC.exe" \
            "build/SHA256SUMS"
